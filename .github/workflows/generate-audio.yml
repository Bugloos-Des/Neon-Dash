name: Generate Audio

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate files that already exist in assets/audio/'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate sound effects and music via ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS }}
          FORCE_REGENERATE: ${{ inputs.force }}
        run: python3 scripts/generate_audio.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/audio
          if git diff --cached --quiet; then
            echo "No new audio files to commit."
          else
            git commit -m "Generate sound effects and music via ElevenLabs"
            git push
          fi
