name: Deploy Games

on:
  push:
    branches:
      - main
    paths:
      - 'cosmo-leap.html'
      - 'neon-dash.html'
      - 'assets/**'
      - 'games/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Deploy over SSH (password auth)
        env:
          SSH_PASSWORD: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          TARGET_PATH: ${{ secrets.SERVER_TARGET_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          PORT="${SERVER_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          export SSHPASS="$SSH_PASSWORD"
          sshpass -e rsync -avz --exclude 'README.md' -e "ssh -p $PORT" cosmo-leap.html neon-dash.html assets games "$SERVER_USER@$SERVER_HOST:$TARGET_PATH"
